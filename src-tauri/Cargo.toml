[package]
name = "mework"
version = "0.1.0"
description = "A local-first mework desktop application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mework_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "native-tls"] }
base64 = "0.23"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["formatting"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", features = ["UNError", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "block2"] }

[target.'cfg(windows)'.dependencies]
dirs = "7"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
keyring = "4.2.0"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

# macOS 27 rejects stripped release proc-macro dylibs (notably sqlx_macros).
[profile.release.build-override]
strip = false
