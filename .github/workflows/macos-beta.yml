name: Publish Mework macOS beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer for the ad-hoc macOS beta release"
        required: true
        default: "0.1.2"
        type: string

concurrency:
  group: publish-mework-macos-beta
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_beta:
    name: Build macOS Apple Silicon beta
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install requested Rust target
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          rustup target list --installed

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Set beta version and updater endpoint
        shell: bash
        env:
          MEWORK_VERSION: ${{ inputs.version }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" != "$MEWORK_VERSION" ]; then
            npm version --no-git-tag-version --ignore-scripts "$MEWORK_VERSION"
          fi
          python - "$MEWORK_VERSION" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit("Beta version must be valid SemVer")
          config_path = Path("src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["version"] = version
          config["plugins"]["updater"]["endpoints"] = [
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"
          ]
          config_path.write_text(json.dumps(config, indent=2) + "\n")

          cargo_path = Path("src-tauri/Cargo.toml")
          cargo = cargo_path.read_text()
          cargo_path.write_text(re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', cargo, count=1))
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ad-hoc app and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: .
          tagName: mework-v__VERSION__
          releaseName: Mework v__VERSION__ (ad-hoc beta)
          releaseBody: |
            macOS Apple Silicon beta build.

            This build is ad-hoc signed and not notarized. On first launch, macOS may require:
            System Settings → Privacy & Security → Open Anyway.

            The DMG is intentionally not included. Download the .app.zip asset, extract Mework.app, and move it to Applications.
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --bundles app

      - name: Add Finder-friendly app archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEWORK_VERSION: ${{ inputs.version }}
        run: |
          archive="Mework_${MEWORK_VERSION}_aarch64.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Mework.app" \
            "$archive"
          gh release upload "mework-v${MEWORK_VERSION}" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish complete beta release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEWORK_VERSION: ${{ inputs.version }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"mework-v${MEWORK_VERSION}\") | .id")
          test -n "$release_id"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            --silent

  cleanup_failed_beta:
    name: Cleanup failed beta release
    needs: build_beta
    if: ${{ always() && needs.build_beta.result != 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MEWORK_VERSION: ${{ inputs.version }}
    steps:
      - name: Delete incomplete beta release and tag
        shell: bash
        run: |
          gh release delete "mework-v${MEWORK_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag || true
