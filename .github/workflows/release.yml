name: Publish Mework

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit SemVer; leave empty for the next patch version"
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "components.json"
      - "rust-toolchain.toml"

concurrency:
  group: publish-mework
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Calculate SemVer
        id: release_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force
          BASE_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION=$(python - "$BASE_VERSION" <<'PY'
          import re
          import subprocess
          import sys

          base = sys.argv[1]
          versions = []
          for tag in subprocess.check_output(["git", "tag", "--list", "mework-v*"], text=True).splitlines():
              match = re.fullmatch(r"mework-v(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))
          if not versions:
              print(base)
          else:
              major, minor, patch = max(versions)
              print(f"{major}.{minor}.{patch + 1}")
          PY
            )
          fi
          python - "$VERSION" <<'PY'
          import re
          import sys
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", sys.argv[1]):
              raise SystemExit("Release version must be valid SemVer")
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=0
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

  build:
    name: Build ${{ matrix.name }}
    needs: prepare_release
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: ''
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install requested Rust target
        if: matrix.target != ''
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          rustup target list --installed

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Set release version and updater endpoint
        shell: bash
        env:
          MEWORK_VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" != "$MEWORK_VERSION" ]; then
            npm version --no-git-tag-version --ignore-scripts "$MEWORK_VERSION"
          fi
          python - "$MEWORK_VERSION" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          config_path = Path("src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["version"] = version
          config["plugins"]["updater"]["endpoints"] = [
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/latest/download/latest.json"
          ]
          config_path.write_text(json.dumps(config, indent=2) + "\n")

          cargo_path = Path("src-tauri/Cargo.toml")
          cargo = cargo_path.read_text()
          cargo_path.write_text(re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', cargo, count=1))
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload draft release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: mework-v__VERSION__
          releaseName: Mework v__VERSION__
          releaseBody: |
            Download the installer for your platform from the assets below.

            The release also contains signed updater artifacts for in-app updates.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish_release:
    name: Publish release
    needs:
      - prepare_release
      - build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: mework-v${{ needs.prepare_release.outputs.version }}
    steps:
      - name: Publish complete draft release
        shell: bash
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            --silent

  cleanup_failed_release:
    name: Cleanup failed release
    needs:
      - prepare_release
      - build
      - publish_release
    if: ${{ always() && needs.prepare_release.result == 'success' && (needs.build.result != 'success' || needs.publish_release.result != 'success') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: mework-v${{ needs.prepare_release.outputs.version }}
    steps:
      - name: Delete incomplete draft release and tag
        shell: bash
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
