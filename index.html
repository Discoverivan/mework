<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mework-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mework</title>
    <script>
      (() => {
        let preference = "system";
        try {
          const cached = window.localStorage.getItem("mework.appearance.theme.v1");
          if (cached === "system" || cached === "light" || cached === "dark") preference = cached;
        } catch {
          // Fall back to the operating-system preference when storage is unavailable.
        }
        const theme = preference === "system"
          ? (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/frontend/startup.css" />
  </head>

  <body>
    <div id="root"></div>
    <div id="startup-splash" class="splash-screen" role="status" aria-label="Loading mework" aria-busy="true">
      <div class="splash-panel">
        <img class="splash-logo" src="/mework-icon.png" alt="mework" />
        <div class="splash-copy">
          <strong>Loading mework</strong>
          <span>Preparing your workspace…</span>
        </div>
        <div class="splash-progress-track" role="progressbar" aria-label="Application loading" aria-valuetext="Loading application">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
