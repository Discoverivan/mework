<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1eb">
    <meta name="description" content="Download the latest mework desktop release.">
    <link rel="icon" type="image/png" href="assets/mework-icon.png">
    <title>mework — Download</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f1eb;
        --surface: #fffdf9;
        --ink: #171717;
        --muted: #5f5b56;
        --line: #ded8cf;
        --accent: #e45c47;
        --accent-dark: #b63d2f;
        --violet: #7057c9;
        --green: #3e8d71;
        --shadow: 0 24px 65px rgba(56, 43, 28, 0.12);
      }

      * { box-sizing: border-box; }

      html { min-width: 320px; }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; }

      .page {
        width: min(620px, calc(100% - 32px));
        margin: auto;
        padding: 28px 0 34px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.04em;
        text-decoration: none;
      }

      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        box-shadow: 0 4px 12px rgba(107, 75, 53, 0.15);
      }

      .github-link {
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        text-underline-offset: 4px;
      }

      .github-link:hover,
      .github-link:focus-visible { color: var(--ink); }

      .release-header {
        padding: clamp(66px, 12vh, 108px) 0 39px;
        text-align: center;
      }

      .hero-icon {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        box-shadow: 0 15px 30px rgba(107, 75, 53, 0.16);
      }

      .kicker {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 23px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .kicker::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 4px rgba(62, 141, 113, 0.12);
        content: "";
      }

      h1,
      h2,
      p { margin: 0; }

      h1 {
        margin-top: 15px;
        font-size: clamp(52px, 12vw, 76px);
        font-weight: 700;
        letter-spacing: -0.08em;
        line-height: 0.92;
      }

      .version {
        display: inline-flex;
        min-height: 31px;
        align-items: center;
        margin-top: 18px;
        border: 1px solid rgba(112, 87, 201, 0.25);
        border-radius: 999px;
        padding: 0 12px;
        background: rgba(112, 87, 201, 0.08);
        color: var(--violet);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
      }

      .release-status {
        min-height: 18px;
        margin-top: 11px;
        color: var(--muted);
        font-size: 12px;
      }

      .download-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .download-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 19px 22px;
        border-bottom: 1px solid var(--line);
      }

      .download-card-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .release-link {
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        text-underline-offset: 4px;
      }

      .release-link:hover,
      .release-link:focus-visible { color: var(--ink); }

      .download-list {
        display: grid;
        gap: 1px;
        background: var(--line);
      }

      .download-link {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: 13px;
        min-height: 76px;
        padding: 12px 22px;
        background: var(--surface);
        text-decoration: none;
        transition: background 160ms ease;
      }

      .download-link:hover,
      .download-link:focus-visible { background: #fff8f1; }

      .download-link.is-loading { pointer-events: none; }

      .platform-mark {
        display: inline-flex;
        width: 40px;
        height: 29px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .download-name,
      .download-file { display: block; }

      .download-name {
        overflow: hidden;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.015em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .download-file {
        min-height: 14px;
        margin-top: 4px;
        overflow: hidden;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .download-action {
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .skeleton {
        display: block;
        width: 82%;
        height: 10px;
        border-radius: 999px;
        background: #ebe5dd;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .skeleton.short { width: 48%; margin-top: 7px; }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      :focus-visible {
        outline: 3px solid rgba(112, 87, 201, 0.48);
        outline-offset: 4px;
      }

      @media (max-width: 520px) {
        .page { width: min(100% - 24px, 420px); padding-top: 18px; }
        .release-header { padding-top: 58px; }
        .download-card-header,
        .download-link { padding-left: 16px; padding-right: 16px; }
        .download-link { grid-template-columns: 40px minmax(0, 1fr); }
        .download-action { grid-column: 2; margin-top: -7px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .skeleton { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="https://github.com/Discoverivan/mework" aria-label="mework on GitHub">
          <img src="assets/mework-icon.png" alt="">
          <span>mework</span>
        </a>
        <a class="github-link" href="https://github.com/Discoverivan/mework">GitHub ↗</a>
      </header>

      <main>
        <section class="release-header" aria-labelledby="app-title">
          <img class="hero-icon" src="assets/mework-icon.png" alt="mework app icon">
          <div class="kicker">Latest desktop release</div>
          <h1 id="app-title">mework</h1>
          <div class="version" id="release-version" aria-live="polite">Checking…</div>
          <p class="release-status" id="release-status" aria-live="polite">Checking GitHub Releases…</p>
        </section>

        <section class="download-card" id="downloads" aria-labelledby="download-title">
          <div class="download-card-header">
            <h2 class="download-card-title" id="download-title">Downloads</h2>
            <a class="release-link" id="release-link" href="https://github.com/Discoverivan/mework/releases/latest">Release details ↗</a>
          </div>
          <div class="download-list" aria-label="Latest platform downloads">
            <a class="download-link is-loading" id="download-mac-arm" href="https://github.com/Discoverivan/mework/releases/latest" aria-disabled="true" tabindex="-1">
              <span class="platform-mark" aria-hidden="true">mac</span>
              <span>
                <span class="download-name">macOS · Apple Silicon</span>
                <span class="download-file"><span class="skeleton"></span><span class="skeleton short"></span></span>
              </span>
              <span class="download-action">Loading…</span>
            </a>
            <a class="download-link is-loading" id="download-mac-intel" href="https://github.com/Discoverivan/mework/releases/latest" aria-disabled="true" tabindex="-1">
              <span class="platform-mark" aria-hidden="true">mac</span>
              <span>
                <span class="download-name">macOS · Intel</span>
                <span class="download-file"><span class="skeleton"></span><span class="skeleton short"></span></span>
              </span>
              <span class="download-action">Loading…</span>
            </a>
            <a class="download-link is-loading" id="download-windows" href="https://github.com/Discoverivan/mework/releases/latest" aria-disabled="true" tabindex="-1">
              <span class="platform-mark" aria-hidden="true">win</span>
              <span>
                <span class="download-name">Windows · Installer</span>
                <span class="download-file"><span class="skeleton"></span><span class="skeleton short"></span></span>
              </span>
              <span class="download-action">Loading…</span>
            </a>
            <a class="download-link is-loading" id="download-windows-msi" href="https://github.com/Discoverivan/mework/releases/latest" aria-disabled="true" tabindex="-1">
              <span class="platform-mark" aria-hidden="true">win</span>
              <span>
                <span class="download-name">Windows · MSI</span>
                <span class="download-file"><span class="skeleton"></span><span class="skeleton short"></span></span>
              </span>
              <span class="download-action">Loading…</span>
            </a>
          </div>
        </section>

      </main>
    </div>

    <script>
      (() => {
        const repository = "Discoverivan/mework";
        const releaseApiUrl = `https://api.github.com/repos/${repository}/releases/latest`;
        const fallback = {
          tag_name: "",
          name: "Latest release",
          html_url: "https://github.com/Discoverivan/mework/releases/latest",
          published_at: "",
          assets: [],
        };
        const assetMatchers = {
          "download-mac-arm": /_aarch64\.dmg$/,
          "download-mac-intel": /_x64\.dmg$/,
          "download-windows": /_x64-setup\.exe$/,
          "download-windows-msi": /_x64_en-US\.msi$/,
        };

        function setText(id, value) {
          const element = document.getElementById(id);
          if (element) element.textContent = value;
        }

        function versionLabel(release) {
          const tag = String(release.tag_name || "");
          return tag ? tag.replace(/^mework-/, "") : "Latest";
        }

        function releaseDate(release) {
          if (!release.published_at) return "Release details are available on GitHub";
          const date = new Date(release.published_at);
          if (Number.isNaN(date.getTime())) return "Release details are available on GitHub";
          return `Published ${new Intl.DateTimeFormat("en", { month: "short", day: "numeric", year: "numeric" }).format(date)}`;
        }

        function safeReleaseUrl(value) {
          try {
            const url = new URL(value);
            if (url.protocol !== "https:" || url.hostname !== "github.com") return null;
            if (!url.pathname.startsWith(`/${repository}/releases/`)) return null;
            return url.href;
          } catch {
            return null;
          }
        }

        function safeAssetUrl(value) {
          try {
            const url = new URL(value);
            if (url.protocol !== "https:" || url.hostname !== "github.com") return null;
            if (!url.pathname.startsWith(`/${repository}/releases/download/`)) return null;
            return url.href;
          } catch {
            return null;
          }
        }

        function findAsset(release, matcher) {
          return (Array.isArray(release.assets) ? release.assets : []).find((asset) => matcher.test(String(asset.name || "")));
        }

        function renderRelease(release, usingFallback = false) {
          const releaseUrl = safeReleaseUrl(release.html_url) || fallback.html_url;
          setText("release-version", versionLabel(release));
          setText("release-status", usingFallback ? "Release details are available on GitHub" : releaseDate(release));
          const releaseLink = document.getElementById("release-link");
          if (releaseLink) releaseLink.href = releaseUrl;

          Object.entries(assetMatchers).forEach(([elementId, matcher]) => {
            const element = document.getElementById(elementId);
            if (!element) return;
            const asset = findAsset(release, matcher);
            const url = asset ? safeAssetUrl(asset.browser_download_url) : null;
            element.href = url || releaseUrl;
            element.removeAttribute("aria-disabled");
            element.removeAttribute("tabindex");
            element.classList.remove("is-loading");
            const fileLabel = element.querySelector(".download-file");
            const actionLabel = element.querySelector(".download-action");
            if (fileLabel) fileLabel.textContent = asset?.name || "Open release assets";
            if (actionLabel) actionLabel.textContent = asset ? "Download" : "View release";
          });
        }

        async function loadLatestRelease() {
          try {
            const response = await fetch(releaseApiUrl, {
              headers: { Accept: "application/vnd.github+json" },
              cache: "no-store",
            });
            if (!response.ok) throw new Error("GitHub Releases API unavailable");
            const release = await response.json();
            if (!release || !release.tag_name || !Array.isArray(release.assets)) throw new Error("Invalid release response");
            renderRelease(release);
          } catch {
            renderRelease(fallback, true);
          }
        }

        void loadLatestRelease();
      })();
    </script>
  </body>
</html>
